# Provider/model configuration only. Credentials come from the environment.
matcher:
  name: magneto
  params:
    model: models/all-mpnet-base-v2
    encoding_mode: header_values_repeat
    sampling_mode: priority_sampling
    sampling_size: 10
    topk: 20
    embedding_threshold: 0.1
    include_equal_matches: true
    reranker: llm
    rerank_k: null
    bidirectional: false
    llm_model: deepseek-flash
    llm_base_url: https://api.deepseek.com
    llm_api_key_env: DEEPSEEK_API_KEY
    llm_backend: openai
    llm_extra_body:
      thinking:
        type: disabled
    llm_temperature: 0.0
    llm_max_tokens: 2048
    llm_max_attempts: 3
    llm_prompt: magneto
    llm_sample_size: 10
    llm_max_variants: null
    llm_value_chars: null
    llm_workers: 4
    llm_require_success: true
    llm_price:
    - 0.006
    - 0.3
    - 1.2
